; =====================================================================
;  php/forja.ini · Directivas PHP del entorno de desarrollo (UD2)
;  Se monta en /usr/local/etc/php/conf.d/zz-forja.ini
;  Tras modificarlo:  docker compose restart php
; =====================================================================

; Mostrar errores durante el desarrollo
display_errors = On

; Mostrar todos los errores posibles
error_reporting = E_ALL

; Zona horaria utilizada por PHP
date.timezone = Europe/Madrid

; Permitir etiquetas cortas <? ?> (para pruebas)
short_open_tag = On

; Ocultar versión de PHP en cabeceras
expose_php = Off

; Límite de memoria para scripts PHP
memory_limit = 256M